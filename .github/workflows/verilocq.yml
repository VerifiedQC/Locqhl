name: VeriLocQ

on:
  push:
    branches: [main]
    paths:
      - 'tools/verilocq/**'
      - '.github/workflows/verilocq.yml'
  pull_request:
    paths:
      - 'tools/verilocq/**'
      - '.github/workflows/verilocq.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/verilocq
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/verilocq/pyproject.toml
      - name: Install verifier and Notebook dependencies
        run: python -m pip install -e ".[notebook]"
      - name: Run verification regressions
        run: python -m unittest discover -s tests -v
      - name: Execute Quickstart
        run: python scripts/execute_notebook.py
